function saveRouteCache(cache){try{cache.savedAt=Date.now();localStorage.setItem(ROUTE_CACHE_KEY,JSON.stringify(cache))}catch{}}
function drawRoadPath(segment,path){if(!Array.isArray(path)||path.length<2)return false;const old=routeLines.get(segment.key);if(old)tripMap.remove(old);const line=new AMapGlobal.Polyline({map:tripMap,path,strokeColor:COLORS[segment.dayIndex],strokeWeight:5,strokeOpacity:.84,showDir:true,lineJoin:"round",zIndex:40+segment.dayIndex});routeLines.set(segment.key,line);return true}
function searchRoadPath(segment){return new Promise(resolve=>{const driving=new AMapGlobal.Driving({policy:AMapGlobal.DrivingPolicy.LEAST_TIME,hideMarkers:true,showTraffic:false});driving.search([segment.a.lng,segment.a.lat],[segment.b.lng,segment.b.lat],(status,result)=>{if(status!=="complete"){resolve(null);return}const path=(result.routes&&result.routes[0]&&result.routes[0].steps||[]).flatMap(step=>step.path||[]).map(p=>[Number(p.lng.toFixed(6)),Number(p.lat.toFixed(6))]);resolve(path.length>1?path:null)})})}
async function searchRoadPathWithRetry(segment,maxAttempts=3){for(let attempt=1;attempt<=maxAttempts;attempt++){const path=await searchRoadPath(segment);if(path)return path;if(attempt<maxAttempts)await delay(500*attempt)}return null}
async function drawActualRoutes(){const segments=getRouteSegments(),status=document.getElementById("map-status"),cache=readRouteCache(),cacheFresh=Date.now()-(cache.savedAt||0)<ROUTE_CACHE_MAX_AGE;let cached=0,loaded=0,failed=0;for(const segment of segments){if(drawRoadPath(segment,cache.segments[segment.key]))cached++}if(cached)status.textContent="已从本机缓存显示 "+cached+"/"+segments.length+" 段实际驾车路线";for(const segment of segments){if(cacheFresh&&cache.segments[segment.key]){loaded++;continue}status.textContent="正在依次加载实际驾车路线 "+(loaded+1)+"/"+segments.length;const path=await searchRoadPathWithRetry(segment,3);if(path){drawRoadPath(segment,path);cache.segments[segment.key]=path;saveRouteCache(cache)}else if(!cache.segments[segment.key]){failed++}loaded++;status.textContent="实际驾车路线 "+loaded+"/"+segments.length;await delay(350)}if(failed){status.textContent="已显示 "+(segments.length-failed)+"/"+segments.length+" 段实际驾车路线；"+failed+" 段请求失败，可稍后刷新重试"}else{status.textContent="已加载完整实际驾车路线";setTimeout(()=>{status.style.display="none"},1200)}}
AMapLoader.load({key:"8104a02115554883420fa71ebf8e941f",version:"2.0",plugins:["AMap.Scale","AMap.ToolBar","AMap.Driving"]}).then(AMap=>{AMapGlobal=AMap;tripMap=new AMap.Map("map",{viewMode:"2D",zoom:6,center:[97.5,38.1],mapStyle:"amap://styles/whitesmoke"});window.tripMap=tripMap;tripMap.addControl(new AMap.Scale());tripMap.addControl(new AMap.ToolBar({position:"RB",liteStyle:true}));DATA.days.forEach((d,i)=>{const p=d.mapPoints[d.mapPoints.length-1],m=new AMap.Marker({position:[p.lng,p.lat],content:"<div class='pin' style='--c:"+COLORS[i]+"'><i>"+d.day+"</i><b>"+routeLabel(d)+"</b></div>",offset:new AMap.Pixel(-25,-18),zIndex:100+i});m.on("click",()=>focusDay(i));m.setMap(tripMap);markers.push(m)});tripMap.setFitView(markers,false,[70,90,70,70],7);drawActualRoutes()}).catch(()=>{document.getElementById("map-status").textContent="地图暂时没有加载出来，请刷新重试。"});
</script>
