document.getElementById("rows").innerHTML=DATA.days.map((d,i)=>"<tr><td><span class='day-badge' style='--c:"+COLORS[i]+"'>"+d.day+"</span></td><td>"+d.date+"</td><td><b>"+routeLabel(d)+"</b></td><td class='schedule'>"+d.timeline.map(x=>"<p>"+x+"</p>").join("")+"</td><td><b>"+d.distance+"</b><br><small>"+d.driveTime+"</small></td><td><div class='hotels'>"+d.hotels.map(h=>"<div class='hotel'><div><b>"+h.name+"</b><small>"+h.note+"</small></div><span>"+h.price+"</span><em>"+h.level+"</em></div>").join("")+"</div></td></tr>").join("");
const budgetGroups=new Map();for(const item of DATA.budget.items){if(!budgetGroups.has(item.category))budgetGroups.set(item.category,[]);budgetGroups.get(item.category).push(item)}
let budgetHtml="",budgetTotal=0;for(const [category,items] of budgetGroups){let categoryTotal=0;items.forEach((x,i)=>{categoryTotal+=x.groupTotal;budgetTotal+=x.groupTotal;const source=x.sourceUrl?"<a href='"+x.sourceUrl+"' target='_blank' rel='noreferrer'>"+x.source+"</a>":x.source;budgetHtml+="<tr class='"+(i===0?"category-start":"")+"'><td>"+(i===0?"<b>"+category+"</b>":"")+"</td><td><b>"+x.item+"</b></td><td>"+money(x.unitPrice)+"</td><td>"+x.basis+"</td><td>"+money(x.groupTotal)+"</td><td>"+money(Math.round(x.groupTotal/DATA.budget.travelers))+"</td><td>"+source+"</td></tr>"});budgetHtml+="<tr class='budget-subtotal'><td colspan='4'>"+category+"小计</td><td>"+money(categoryTotal)+"</td><td>"+money(Math.round(categoryTotal/DATA.budget.travelers))+"</td><td></td></tr>"}
const perPersonTotal=Math.round(budgetTotal/DATA.budget.travelers);budgetHtml+="<tr class='budget-total'><td colspan='4'><b>费用合计</b></td><td><b>"+money(budgetTotal)+" / 团</b></td><td><b>"+money(perPersonTotal)+" / 人</b></td><td>按 8 人测算</td></tr>";document.getElementById("budget-rows").innerHTML=budgetHtml;document.getElementById("budget-summary").textContent="费用合计：合计："+money(budgetTotal)+"/团；"+money(perPersonTotal)+"/人 × "+DATA.budget.travelers+"人";document.getElementById("budget-note").textContent=DATA.budget.excludes+" 自选项目（未计入）："+DATA.budget.optional.join("、")+"。";
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("map-view").hidden=b.dataset.tab!=="map";document.getElementById("sheet-view").hidden=b.dataset.tab!=="sheet";if(b.dataset.tab==="map"&&window.tripMap)setTimeout(()=>window.tripMap.resize(),50)});
let AMapGlobal,tripMap,markers=[];
function focusDay(i){showDetail(i);const d=DATA.days[i];if(!tripMap||!AMapGlobal)return;const lngs=d.mapPoints.map(p=>p.lng),lats=d.mapPoints.map(p=>p.lat);if(d.mapPoints.length===1){tripMap.setZoomAndCenter(10,[lngs[0],lats[0]])}else{tripMap.setBounds(new AMapGlobal.Bounds([Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]),false,[80,80,80,80])}}
document.getElementById("route-list").addEventListener("click",e=>{const b=e.target.closest(".route-card");if(b)focusDay(Number(b.dataset.day))});
function getRouteSegments(){const segments=[];DATA.days.forEach((d,di)=>{for(let i=0;i<d.mapPoints.length-1;i++){const a=d.mapPoints[i],b=d.mapPoints[i+1];segments.push({key:di+"-"+i,dayIndex:di,a,b})}});return segments}
const ROUTE_FINGERPRINT=getRouteSegments().map(s=>s.a.name+":"+s.a.lng+","+s.a.lat+">"+s.b.name+":"+s.b.lng+","+s.b.lat).join("|");
const ROUTE_CACHE_KEY="qinggan-driving-route-v6:"+DATA.dateRange+":"+ROUTE_FINGERPRINT;
const ROUTE_CACHE_MAX_AGE=30*24*60*60*1000;
const routeLines=new Map();
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function distanceKm(a,b){const rad=n=>n*Math.PI/180,dLat=rad(b[1]-a[1]),dLng=rad(b[0]-a[0]),v=Math.sin(dLat/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dLng/2)**2;return 6371*2*Math.atan2(Math.sqrt(v),Math.sqrt(1-v))}
function pathMatches(segment,path){return Array.isArray(path)&&path.length>=2&&distanceKm(path[0],[segment.a.lng,segment.a.lat])<50&&distanceKm(path[path.length-1],[segment.b.lng,segment.b.lat])<50}
function readRouteCache(){try{const cache=JSON.parse(localStorage.getItem(ROUTE_CACHE_KEY)||"{}");return cache&&cache.segments?cache:{savedAt:0,segments:{}}}catch{return{savedAt:0,segments:{}}}}
function saveRouteCache(cache){try{cache.savedAt=Date.now();localStorage.setItem(ROUTE_CACHE_KEY,JSON.stringify(cache))}catch{}}
function drawRoadPath(segment,path){if(!pathMatches(segment,path))return false;const old=routeLines.get(segment.key);if(old)tripMap.remove(old);const line=new AMapGlobal.Polyline({map:tripMap,path,strokeColor:COLORS[segment.dayIndex],strokeWeight:5,strokeOpacity:.84,showDir:true,lineJoin:"round",zIndex:40+segment.dayIndex});routeLines.set(segment.key,line);return true}
function searchRoadPath(segment){return new Promise(resolve=>{const driving=new AMapGlobal.Driving({policy:AMapGlobal.DrivingPolicy.LEAST_TIME,hideMarkers:true,showTraffic:false});driving.search([segment.a.lng,segment.a.lat],[segment.b.lng,segment.b.lat],(status,result)=>{if(status!=="complete"){resolve(null);return}const path=(result.routes&&result.routes[0]&&result.routes[0].steps||[]).flatMap(step=>step.path||[]).map(p=>[Number(p.lng.toFixed(6)),Number(p.lat.toFixed(6))]);resolve(path.length>1?path:null)})})}
async function searchRoadPathWithRetry(segment,maxAttempts=3){for(let attempt=1;attempt<=maxAttempts;attempt++){const path=await searchRoadPath(segment);if(path)return path;if(attempt<maxAttempts)await delay(500*attempt)}return null}
async function drawActualRoutes(){const segments=getRouteSegments(),status=document.getElementById("map-status"),cache=readRouteCache();let loaded=0,failed=0;for(const segment of segments){const path=PRECOMPUTED_ROUTES[segment.key]||cache.segments[segment.key];if(drawRoadPath(segment,path))loaded++}if(loaded===segments.length){status.textContent="已加载完整实际驾车路线 "+loaded+"/"+segments.length;setTimeout(()=>{status.style.display="none"},800);return}status.textContent="正在补全实际驾车路线 "+loaded+"/"+segments.length;for(const segment of segments){if(routeLines.has(segment.key))continue;const path=await searchRoadPathWithRetry(segment,4);if(pathMatches(segment,path)){drawRoadPath(segment,path);cache.segments[segment.key]=path;saveRouteCache(cache);loaded++}else failed++;status.textContent="实际驾车路线 "+loaded+"/"+segments.length;await delay(650)}if(failed){status.textContent="已显示 "+loaded+"/"+segments.length+" 段实际驾车路线；其余路段稍后自动重试"}else{status.textContent="已加载完整实际驾车路线 "+loaded+"/"+segments.length;setTimeout(()=>{status.style.display="none"},1200)}}
function getMapPoints(){const unique=new Map();DATA.days.forEach((d,di)=>d.mapPoints.forEach((p,pi)=>{const key=p.name+"|"+p.lng+","+p.lat;if(!unique.has(key))unique.set(key,{...p,dayIndex:di,days:[d.day],isIntermediate:pi>0&&pi<d.mapPoints.length-1});else{const saved=unique.get(key);if(!saved.days.includes(d.day))saved.days.push(d.day);saved.isIntermediate=saved.isIntermediate||(pi>0&&pi<d.mapPoints.length-1)}}));return [...unique.values()]}
AMapLoader.load({key:"8104a02115554883420fa71ebf8e941f",version:"2.0",plugins:["AMap.Scale","AMap.ToolBar","AMap.Driving"]}).then(AMap=>{AMapGlobal=AMap;tripMap=new AMap.Map("map",{viewMode:"2D",zoom:6,center:[97.5,38.1],mapStyle:"amap://styles/whitesmoke"});window.tripMap=tripMap;tripMap.addControl(new AMap.Scale());tripMap.addControl(new AMap.ToolBar({position:"RB",liteStyle:true}));getMapPoints().forEach(p=>{const m=new AMap.Marker({position:[p.lng,p.lat],content:"<div class='point-pin' style='--c:"+COLORS[p.dayIndex]+"'><i></i><b>"+p.name+"</b><small>"+p.days.join("/")+"</small></div>",offset:new AMap.Pixel(-12,-14),zIndex:p.isIntermediate?115:105});m.setMap(tripMap);markers.push(m)});tripMap.setFitView(markers,false,[70,90,70,70],7);drawActualRoutes()}).catch(()=>{document.getElementById("map-status").textContent="地图暂时没有加载出来，请刷新重试。"});
</script>
