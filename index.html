document.getElementById("route-list").innerHTML=DATA.days.map((d,i)=>"<button class='route-card"+(i===1?" active":"")+"' data-day='"+i+"' style='--c:"+COLORS[i]+"'><span class='day'>"+d.day+"</span><span class='route-copy'><b>"+routeLabel(d)+"</b><small>"+d.date+" · "+d.distance+" · "+d.driveTime+"</small></span></button>").join("");
function showDetail(i){const d=DATA.days[i];document.getElementById("detail").innerHTML="<b>"+d.day+" · "+d.date+" · "+routeLabel(d)+"</b><p>"+d.schedule.join("；")+"</p>";document.querySelectorAll(".route-card").forEach((b,j)=>b.classList.toggle("active",j===i))}showDetail(1);
document.getElementById("rows").innerHTML=DATA.days.map((d,i)=>"<tr><td><span class='day-badge' style='--c:"+COLORS[i]+"'>"+d.day+"</span></td><td>"+d.date+"</td><td><b>"+routeLabel(d)+"</b></td><td class='schedule'>"+d.schedule.map(x=>"<p>"+x+"</p>").join("")+"</td><td><b>"+d.distance+"</b><br><small>"+d.driveTime+"</small></td><td><div class='hotels'>"+d.hotels.map(h=>"<div class='hotel'><div><b>"+h.name+"</b><small>"+h.note+"</small></div><span>"+h.price+"</span><em>"+h.level+"</em></div>").join("")+"</div></td></tr>").join("");
let totalLow=0,totalHigh=0;document.getElementById("budget-rows").innerHTML=DATA.budget.items.map(x=>{totalLow+=x.groupLow;totalHigh+=x.groupHigh;return"<tr><td><b>"+x.category+"</b></td><td>"+x.basis+"</td><td>"+money(x.groupLow)+"–"+money(x.groupHigh)+"</td><td>"+money(Math.round(x.groupLow/DATA.budget.travelers))+"–"+money(Math.round(x.groupHigh/DATA.budget.travelers))+"</td></tr>"}).join("")+"<tr class='budget-total'><td><b>合计</b></td><td>不含往返大交通</td><td><b>"+money(totalLow)+"–"+money(totalHigh)+"</b></td><td><b>"+money(Math.round(totalLow/DATA.budget.travelers))+"–"+money(Math.round(totalHigh/DATA.budget.travelers))+"</b></td></tr>";document.getElementById("budget-note").textContent=DATA.budget.excludes;
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));document.getElementById("map-view").hidden=b.dataset.tab!=="map";document.getElementById("sheet-view").hidden=b.dataset.tab!=="sheet";if(b.dataset.tab==="map"&&window.tripMap)setTimeout(()=>window.tripMap.resize(),50)});
let AMapGlobal,tripMap,markers=[];
function focusDay(i){showDetail(i);const d=DATA.days[i];if(!tripMap||!AMapGlobal)return;const lngs=d.mapPoints.map(p=>p.lng),lats=d.mapPoints.map(p=>p.lat);if(d.mapPoints.length===1){tripMap.setZoomAndCenter(10,[lngs[0],lats[0]])}else{tripMap.setBounds(new AMapGlobal.Bounds([Math.min(...lngs),Math.min(...lats)],[Math.max(...lngs),Math.max(...lats)]),false,[80,80,80,80])}}
document.getElementById("route-list").addEventListener("click",e=>{const b=e.target.closest(".route-card");if(b)focusDay(Number(b.dataset.day))});
function drawActualRoutes(){let pending=DATA.days.reduce((n,d)=>n+Math.max(0,d.mapPoints.length-1),0),done=0,failed=0;const status=document.getElementById("map-status");const finish=ok=>{done++;if(!ok)failed++;status.textContent="实际驾车路线 "+done+"/"+pending;if(done===pending){status.textContent=failed?"部分偏远路段无法规划，其余为实际驾车路线":"已加载实际驾车路线";setTimeout(()=>{if(!failed)status.style.display="none"},1000)}};DATA.days.forEach((d,di)=>{for(let i=0;i<d.mapPoints.length-1;i++){const a=d.mapPoints[i],b=d.mapPoints[i+1],driving=new AMapGlobal.Driving({policy:AMapGlobal.DrivingPolicy.LEAST_TIME,hideMarkers:true,showTraffic:false});driving.search([a.lng,a.lat],[b.lng,b.lat],(s,r)=>{if(s!=="complete"){finish(false);return}const path=(r.routes&&r.routes[0]&&r.routes[0].steps||[]).flatMap(step=>step.path||[]);if(!path.length){finish(false);return}new AMapGlobal.Polyline({map:tripMap,path,strokeColor:COLORS[di],strokeWeight:5,strokeOpacity:.84,showDir:true,lineJoin:"round",zIndex:40+di});finish(true)})}})}
AMapLoader.load({key:"8104a02115554883420fa71ebf8e941f",version:"2.0",plugins:["AMap.Scale","AMap.ToolBar","AMap.Driving"]}).then(AMap=>{AMapGlobal=AMap;tripMap=new AMap.Map("map",{viewMode:"2D",zoom:6,center:[97.5,38.1],mapStyle:"amap://styles/whitesmoke"});window.tripMap=tripMap;tripMap.addControl(new AMap.Scale());tripMap.addControl(new AMap.ToolBar({position:"RB",liteStyle:true}));DATA.days.forEach((d,i)=>{const p=d.mapPoints[d.mapPoints.length-1],m=new AMap.Marker({position:[p.lng,p.lat],content:"<div class='pin' style='--c:"+COLORS[i]+"'><i>"+d.day+"</i><b>"+routeLabel(d)+"</b></div>",offset:new AMap.Pixel(-25,-18),zIndex:100+i});m.on("click",()=>focusDay(i));m.setMap(tripMap);markers.push(m)});tripMap.setFitView(markers,false,[70,90,70,70],7);drawActualRoutes()}).catch(()=>{document.getElementById("map-status").textContent="地图暂时没有加载出来，请刷新重试。"});
</script>
</body>
</html>
