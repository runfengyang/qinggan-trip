function getRouteSegments(){const segments=[];DATA.days.forEach((d,di)=>{for(let i=0;i<d.mapPoints.length-1;i++){const a=d.mapPoints[i],b=d.mapPoints[i+1];segments.push({key:di+"-"+i,dayIndex:di,a,b})}});return segments}

const ROUTE_CACHE_KEY="qinggan-driving-route-v6:"+DATA.dateRange+":"+ROUTE_FINGERPRINT;
const ROUTE_CACHE_MAX_AGE=30*24*60*60*1000;

const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function readRouteCache(){try{const cache=JSON.parse(localStorage.getItem(ROUTE_CACHE_KEY)||"{}");return cache&&cache.segments?cache:{savedAt:0,segments:{}}}catch{return{savedAt:0,segments:{}}}}
function saveRouteCache(cache){try{cache.savedAt=Date.now();localStorage.setItem(ROUTE_CACHE_KEY,JSON.stringify(cache))}catch{}}
function drawRoadPath(segment,path){if(!Array.isArray(path)||path.length<2)return false;const old=routeLines.get(segment.key);if(old)tripMap.remove(old);const line=new AMapGlobal.Polyline({map:tripMap,path,strokeColor:COLORS[segment.dayIndex],strokeWeight:5,strokeOpacity:.84,showDir:true,lineJoin:"round",zIndex:40+segment.dayIndex});routeLines.set(segment.key,line);return true}

async function searchRoadPathWithRetry(segment,maxAttempts=3){for(let attempt=1;attempt<=maxAttempts;attempt++){const path=await searchRoadPath(segment);if(path)return path;if(attempt<maxAttempts)await delay(500*attempt)}return null}
async function drawActualRoutes(){const segments=getRouteSegments(),status=document.getElementById("map-status"),cache=readRouteCache(),cacheFresh=Date.now()-(cache.savedAt||0)<ROUTE_CACHE_MAX_AGE;let loaded=0,failed=0;for(const segment of segments){const path=PRECOMPUTED_ROUTES[segment.key]||cache.segments[segment.key];if(drawRoadPath(segment,path))loaded++}if(loaded===segments.length){status.textContent="已加载完整实际驾车路线 "+loaded+"/"+segments.length;setTimeout(()=>{status.style.display="none"},800);return}status.textContent="正在补全实际驾车路线 "+loaded+"/"+segments.length;for(const segment of segments){if(PRECOMPUTED_ROUTES[segment.key]||(cacheFresh&&cache.segments[segment.key]))continue;const path=await searchRoadPathWithRetry(segment,4);if(path){drawRoadPath(segment,path);cache.segments[segment.key]=path;saveRouteCache(cache);loaded++}else if(!cache.segments[segment.key])failed++;status.textContent="实际驾车路线 "+loaded+"/"+segments.length;await delay(650)}if(failed){status.textContent="已显示 "+loaded+"/"+segments.length+" 段实际驾车路线；其余路段稍后自动重试"}else{status.textContent="已加载完整实际驾车路线 "+loaded+"/"+segments.length;setTimeout(()=>{status.style.display="none"},1200)}}
function getMapPoints(){const unique=new Map();DATA.days.forEach((d,di)=>d.mapPoints.forEach((p,pi)=>{const key=p.name+"|"+p.lng+","+p.lat;if(!unique.has(key))unique.set(key,{...p,dayIndex:di,days:[d.day],isIntermediate:pi>0&&pi<d.mapPoints.length-1});else{const saved=unique.get(key);if(!saved.days.includes(d.day))saved.days.push(d.day);saved.isIntermediate=saved.isIntermediate||(pi>0&&pi<d.mapPoints.length-1)}}));return [...unique.values()]}
AMapLoader.load({key:"8104a02115554883420fa71ebf8e941f",version:"2.0",plugins:["AMap.Scale","AMap.ToolBar","AMap.Driving"]}).then(AMap=>{AMapGlobal=AMap;tripMap=new AMap.Map("map",{viewMode:"2D",zoom:6,center:[97.5,38.1],mapStyle:"amap://styles/whitesmoke"});window.tripMap=tripMap;tripMap.addControl(new AMap.Scale());tripMap.addControl(new AMap.ToolBar({position:"RB",liteStyle:true}));getMapPoints().forEach(p=>{const m=new AMap.Marker({position:[p.lng,p.lat],content:"<div class='point-pin' style='--c:"+COLORS[p.dayIndex]+"'><i></i><b>"+p.name+"</b><small>"+p.days.join("/")+"</small></div>",offset:new AMap.Pixel(-12,-14),zIndex:p.isIntermediate?115:105});m.setMap(tripMap);markers.push(m)});tripMap.setFitView(markers,false,[70,90,70,70],7);drawActualRoutes()}).catch(()=>{document.getElementById("map-status").textContent="地图暂时没有加载出来，请刷新重试。"});
